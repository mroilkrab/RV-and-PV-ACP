    <filter id="ink-bleed" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur stdDeviation="0.2" result="blur" />
      <feMerge>
        <feMergeNode in="SourceGraphic" />
        <feMergeNode in="blur" />
      </feMerge>
    </filter>
  </defs>
  
