       C 225 390, 260 365, 275 305
       C 300 205, 335 90, 360 52
       C 372 32, 385 45, 380 75
       C 370 145, 320 315, 305 405
       C 300 425, 305 435, 315 430
       C 335 410, 365 310, 395 215
       C 405 185, 415 190, 410 220
       C 400 270, 385 340, 385 385
       C 385 415, 400 425, 415 415
       C 435 395, 470 260, 500 135
       C 515 70, 528 42, 542 45
       C 552 48, 552 75, 542 120
       C 525 200, 495 330, 485 410
       C 480 435, 492 445, 505 430
       C 525 405, 550 340, 565 295
       C 572 275, 585 270, 582 290
       C 575 330, 560 380, 555 405
       C 550 425, 560 432, 575 420
