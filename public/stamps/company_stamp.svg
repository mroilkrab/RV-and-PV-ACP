<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <defs>
    <!-- Gradients for 3D red compass/A arms -->
    <linearGradient id="arm-left-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e62020" />
      <stop offset="60%" stop-color="#b80e0e" />
      <stop offset="100%" stop-color="#800606" />
    </linearGradient>
    <linearGradient id="arm-right-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d61818" />
      <stop offset="50%" stop-color="#ab0c0c" />
      <stop offset="100%" stop-color="#730505" />
    </linearGradient>
    <linearGradient id="crossbar-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e31e1e" />
      <stop offset="100%" stop-color="#990a0a" />
    </linearGradient>
    <linearGradient id="yellow-peak" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffd500" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <radialGradient id="gold-pin" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fff59d" />
      <stop offset="40%" stop-color="#fbc02d" />
      <stop offset="100%" stop-color="#f57f17" />
    </radialGradient>
    <!-- Drop Shadow for 3D depth -->
    <filter id="shadow-3d" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="6" stdDeviation="4" flood-color="#4a0000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- LEFT SIDE: Cluster of Vibrant Blue Dots -->
  <g fill="#001ee0">
    <!-- Row 1 -->
    <circle cx="56" cy="74" r="24" />
    <circle cx="114" cy="62" r="20" />
    <circle cx="158" cy="64" r="16" />
    <circle cx="192" cy="70" r="12" />
    <circle cx="218" cy="76" r="9" />
    <circle cx="236" cy="80" r="7" />

    <!-- Row 2 -->
    <circle cx="62" cy="132" r="22" />
    <circle cx="118" cy="116" r="18" />
    <circle cx="160" cy="112" r="14" />
    <circle cx="192" cy="114" r="11" />
    <circle cx="218" cy="118" r="8" />

    <!-- Row 3 -->
    <circle cx="66" cy="186" r="20" />
    <circle cx="120" cy="168" r="16" />
    <circle cx="160" cy="158" r="13" />
    <circle cx="190" cy="156" r="10" />

    <!-- Row 4 -->
    <circle cx="70" cy="236" r="18" />
    <circle cx="120" cy="216" r="14" />
    <circle cx="158" cy="202" r="11" />

    <!-- Row 5 -->
    <circle cx="72" cy="282" r="16" />
    <circle cx="118" cy="260" r="13" />
    <circle cx="152" cy="244" r="9" />

    <!-- Row 6 -->
    <circle cx="74" cy="324" r="13" />
    <circle cx="112" cy="302" r="10" />
  </g>

  <!-- CENTER/RIGHT SIDE: 3D "A" Red Emblem with Top Peak -->
  <g transform="translate(195, 20)">
    <!-- 3D Shadow Base -->
    <polygon points="175,280 200,290 280,290 260,280" fill="#2d0505" opacity="0.3" />
    <polygon points="20,280 40,290 120,290 100,280" fill="#2d0505" opacity="0.3" />

    <!-- Left Leg of 'A' (3D Extrusion) -->
    <!-- Side bevel (Dark Red) -->
    <polygon points="135,28 142,38 46,282 32,274" fill="#4d0505" />
    <polygon points="142,38 152,48 58,284 46,282" fill="#750808" />
    <!-- Front Face (Gradient Red) -->
    <polygon points="152,48 180,95 86,286 58,284" fill="url(#arm-left-grad)" filter="url(#shadow-3d)" />

    <!-- Right Leg of 'A' (3D Extrusion) -->
    <!-- Front Face (Gradient Red) -->
    <polygon points="152,48 180,95 274,286 246,284" fill="url(#arm-right-grad)" filter="url(#shadow-3d)" />
    <!-- Side bevel (Darker Red) -->
    <polygon points="274,286 288,276 195,88 180,95" fill="#5c0606" />

    <!-- Yellow Peak (Top Apex) -->
    <polygon points="152,48 168,0 184,48" fill="url(#yellow-peak)" />
    <polygon points="168,0 184,48 198,42" fill="#c47a04" />

    <!-- Curved Arched Red Crossbar "Account Planet" -->
    <path
      d="M 64 168
         C 120 220, 210 220, 268 168
         L 282 196
         C 220 252, 112 252, 50 196
         Z"
      fill="url(#crossbar-grad)"
      filter="url(#shadow-3d)"
    />

    <!-- White text inside crossbar -->
    <!-- Text follows path or styled centered text -->
    <text
      x="166"
      y="222"
      fill="#ffffff"
      font-family="Arial, Helvetica, sans-serif"
      font-size="25"
      font-weight="900"
      font-style="italic"
      text-anchor="middle"
      letter-spacing="0.5"
    >
      Account Planet
    </text>

    <!-- Golden/Yellow spherical pins at ends of crossbar -->
    <circle cx="58" cy="186" r="14" fill="url(#gold-pin)" filter="url(#shadow-3d)" />
    <circle cx="274" cy="186" r="14" fill="url(#gold-pin)" filter="url(#shadow-3d)" />

    <!-- Bottom Foot details of the legs -->
    <polygon points="44,282 66,286 38,300 24,292" fill="#8f0c0c" />
    <polygon points="266,284 288,280 300,292 278,298" fill="#8f0c0c" />
  </g>

  <!-- BOTTOM TYPOGRAPHY: Company Name & Subtitle -->
  <g text-anchor="middle" id="company-stamp-text">
    <!-- Thai Line -->
    <text
      x="345"
      y="342"
      fill="#111827"
      font-family="'Sarabun', 'Prompt', 'Noto Sans Thai', sans-serif"
      font-size="23"
      font-weight="600"
      letter-spacing="1"
    >
      บริษัท แอ็คเคาน์ แพลนเน็ท จำกัด
    </text>

    <!-- English Line -->
    <text
      x="345"
      y="368"
      fill="#1f2937"
      font-family="'Arial', 'Helvetica', sans-serif"
      font-size="16"
      font-weight="700"
      letter-spacing="0.8"
    >
      Account Planet Co.,Ltd.
    </text>

    <!-- Subtitle Line -->
    <text
      x="345"
      y="388"
      fill="#6b7280"
      font-family="'Arial', 'Helvetica', sans-serif"
      font-size="11"
      font-weight="600"
      letter-spacing="1.5"
    >
      Auditing / Accounting / Consulting
    </text>
  </g>
</svg>
