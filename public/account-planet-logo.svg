<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" width="100%" height="100%">
  <defs>
    <!-- Blue Dots Gradient / Color -->
    <linearGradient id="dotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0033ff"/>
      <stop offset="100%" stop-color="#0018d6"/>
    </linearGradient>

    <!-- Gold Peak Gradient -->
    <linearGradient id="goldPeakGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="60%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>

    <!-- Gold Shadow Peak -->
    <linearGradient id="goldPeakShadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#854d0e"/>
      <stop offset="100%" stop-color="#713f12"/>
    </linearGradient>

    <!-- Gold Sphere Gradient -->
    <radialGradient id="goldSphereGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="85%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </radialGradient>

    <!-- Red 3D Face Gradient -->
    <linearGradient id="redFrontGrad" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="40%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>

    <!-- Red 3D Dark Shadow Extrusion -->
    <linearGradient id="redExtrudeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7f1d1d"/>
      <stop offset="50%" stop-color="#581c1c"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </linearGradient>

    <!-- Red Ribbon Gradient -->
    <linearGradient id="ribbonGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#991b1b"/>
      <stop offset="25%" stop-color="#dc2626"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="75%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>

    <!-- Ribbon Under-Shadow -->
    <linearGradient id="ribbonShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#581c1c"/>
      <stop offset="100%" stop-color="#380a0a"/>
    </linearGradient>

    <!-- Text Path for Arched 'Account Planet' -->
    <path id="ribbonArcPath" d="M 195 190 Q 305 140 415 190" fill="none"/>

    <!-- Subtle Drop Shadow Filter -->
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.25" flood-color="#000000"/>
    </filter>
  </defs>

  <g id="logo-emblem" transform="translate(10, 5)">
    <!-- ==================== BLUE DOTS CLUSTER (TOP-LEFT) ==================== -->
    <g id="blue-dots" fill="url(#dotGrad)">
      <!-- Row 1 -->
      <circle cx="50" cy="38" r="22"/>
      <circle cx="95" cy="30" r="16"/>
      <circle cx="135" cy="28" r="13"/>
      <circle cx="168" cy="27" r="10"/>
      <circle cx="198" cy="30" r="11"/>

      <!-- Row 2 -->
      <circle cx="38" cy="85" r="24"/>
      <circle cx="85" cy="78" r="17"/>
      <circle cx="125" cy="70" r="14"/>
      <circle cx="160" cy="62" r="11"/>
      <circle cx="190" cy="60" r="9"/>
      <circle cx="212" cy="72" r="7"/>

      <!-- Row 3 -->
      <circle cx="48" cy="138" r="20"/>
      <circle cx="90" cy="125" r="16"/>
      <circle cx="130" cy="112" r="13"/>
      <circle cx="162" cy="100" r="10"/>
      <circle cx="188" cy="94" r="8"/>
      <circle cx="210" cy="95" r="7"/>
      <circle cx="205" cy="120" r="8"/>

      <!-- Row 4 -->
      <circle cx="42" cy="188" r="17"/>
      <circle cx="80" cy="172" r="15"/>
      <circle cx="118" cy="158" r="13"/>
      <circle cx="148" cy="144" r="10"/>
      <circle cx="172" cy="136" r="8"/>
      <circle cx="192" cy="132" r="6"/>
      <circle cx="190" cy="155" r="7"/>

      <!-- Row 5 -->
      <circle cx="52" cy="235" r="13"/>
      <circle cx="82" cy="216" r="14"/>
      <circle cx="112" cy="202" r="11"/>
      <circle cx="138" cy="188" r="9"/>
      <circle cx="158" cy="178" r="7"/>
      <circle cx="176" cy="170" r="6"/>
    </g>

    <!-- ==================== LETTER "A" 3D SYMBOL ==================== -->
    <g id="letter-A-mark" transform="translate(10, 0)">
      <!-- 1. Gold Peak 3D Shadow (Left Facet) -->
      <polygon points="305,25 288,28 274,86 290,82" fill="url(#goldPeakShadow)"/>

      <!-- 2. Gold Peak Front Face -->
      <polygon points="305,25 290,82 322,82" fill="url(#goldPeakGrad)"/>

      <!-- 3. Red 3D Extrusion Shadow (Left Side of Left Leg) -->
      <polygon points="290,82 274,86 168,260 186,260" fill="url(#redExtrudeGrad)"/>

      <!-- 4. Red 3D Extrusion Shadow (Inner Gap of A) -->
      <polygon points="294,115 316,115 352,210 334,210" fill="#450a0a" opacity="0.85"/>

      <!-- 5. Red 3D Extrusion Shadow (Right Leg Inner Depth) -->
      <polygon points="322,82 342,82 422,260 402,260" fill="url(#redExtrudeGrad)"/>

      <!-- 6. Left Red Leg (Front) -->
      <polygon points="290,82 308,82 216,260 186,260" fill="url(#redFrontGrad)"/>

      <!-- 7. Right Red Leg (Front) -->
      <polygon points="308,82 324,82 422,260 392,260" fill="url(#redFrontGrad)"/>

      <!-- 8. Subtle Foot Reflection on ground -->
      <polygon points="186,260 216,260 212,268 184,268" fill="#b91c1c" opacity="0.3"/>
      <polygon points="392,260 422,260 420,268 394,268" fill="#b91c1c" opacity="0.3"/>

      <!-- 9. Curved Red Ribbon / Crossbar Shadow -->
      <path d="M 180 182 Q 305 125 430 182 Q 305 150 180 182" fill="url(#ribbonShadow)"/>

      <!-- 10. Curved Red Ribbon / Crossbar (Front 3D Arch) -->
      <path d="M 172 178 Q 305 120 438 178 L 434 205 Q 305 152 176 205 Z" fill="url(#ribbonGrad)" filter="url(#softShadow)"/>

      <!-- 11. White Text 'Account Planet' arched across ribbon -->
      <text font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="22" fill="#ffffff" letter-spacing="1">
        <textPath href="#ribbonArcPath" startOffset="50%" text-anchor="middle">
          Account Planet
        </textPath>
      </text>

      <!-- 12. Golden Spheres at both ends of the Ribbon -->
      <!-- Left Sphere -->
      <circle cx="178" cy="188" r="13" fill="url(#goldSphereGrad)" filter="url(#softShadow)"/>
      <ellipse cx="174" cy="184" rx="4" ry="2.5" fill="#ffffff" opacity="0.6"/>

      <!-- Right Sphere -->
      <circle cx="432" cy="188" r="13" fill="url(#goldSphereGrad)" filter="url(#softShadow)"/>
      <ellipse cx="428" cy="184" rx="4" ry="2.5" fill="#ffffff" opacity="0.6"/>
    </g>
  </g>

  <!-- ==================== TYPOGRAPHY (BOTTOM) ==================== -->
  <g id="company-name-text" transform="translate(270, 290)" text-anchor="middle">
    <!-- Line 1: Thai Name with traditional Thai loop style -->
    <text y="0" font-family="'Prompt', 'Sarabun', 'Leelawadee UI', 'Thonburi', sans-serif" font-weight="600" font-size="24" fill="#0f172a" letter-spacing="3.5">
      บริษัท แอ็คเคาน์ แพลนเน็ท จำกัด
    </text>

    <!-- Line 2: English Name -->
    <text y="21" font-family="'Prompt', 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="15" fill="#1e293b" letter-spacing="1.2">
      Account Planet Co.,Ltd.
    </text>

    <!-- Line 3: Service Categories -->
    <text y="36" font-family="'Prompt', 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="11.5" fill="#64748b" letter-spacing="1">
      Auditing  /  Accounting  /  Consulting
    </text>

    <!-- Subtle Faint Reflection of Line 3 -->
    <text y="44" font-family="'Prompt', 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="11.5" fill="#cbd5e1" letter-spacing="1" opacity="0.4" transform="scale(1, -0.6) translate(0, -66)">
      Auditing  /  Accounting  /  Consulting
    </text>
  </g>
</svg>
